server-logs-configuration-name=Server Logs
company-logs-enabled=Show per company logs
company-logs-enabled-help=List the log directory of each company, matching the behavior of the built-in Server Logs application.
excluded-folder-names=Excluded folder names
excluded-folder-names-help=Sub folders of the logs directory that must never appear in the source dropdown. The companies folder is excluded by default because it is already listed per company.
folder-label-overrides=Folder labels
folder-label-overrides-help=Optional friendly names for log folders, one entry per line, in the form folderName=Label. For example copilot=AI Copilot.
logs-directory=Logs directory
logs-directory-help=Absolute path of the directory to scan. Leave blank to derive it from the Log4j configuration, falling back to the logs folder inside the Liferay home.
max-preview-size=Maximum preview size
max-preview-size-help=Number of bytes read from the end of a log file when previewing it in the browser. The full file is always available through Download.
root-logs-enabled=Show logs stored directly in the logs directory
root-logs-enabled-help=List the log files that are not inside any sub folder, such as liferay.yyyy-MM-dd.log.
server-sources-omniadmin-only=Restrict server wide logs to omniadmins
server-sources-omniadmin-only-help=Server wide log folders are not scoped to a single company. Keep this enabled so only omniadmins can read them.
